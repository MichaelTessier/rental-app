query getCars($input: CarsInput) {
  cars(input: $input) {
    items {
      ...CarList
    }
    pagination {
      ...Pagination
    }
  }
}

query getCar($id: ObjectID!) {
  car(id: $id) {
    ...Car
  }
}

fragment CarList on Car {
  name
  category
  fuelType
  images {
    ...Image
  }
  id
  rentPerDay
  transmission
  ratings {
    count
    value
  }
}

fragment Pagination on Pagination {
  total
  page
  limit
}

fragment Car on Car {
  id
  name
  description
  status
  rentPerDay
  address
  year
  power
  millage
  brand
  transmission
  fuelType
  seats
  doors
  category
  images {
    ...Image
  }
  createdAt
  updatedAt
  ratings {
    count
    value
  }
}